    'app/src/main/java/com/taqwimi/mahaam/AlarmScheduler.java': r'''package com.taqwimi.mahaam;

import android.app.AlarmManager;
import android.app.PendingIntent;
import android.content.Context;
import android.content.Intent;
import android.content.SharedPreferences;
import android.os.Build;

import org.json.JSONArray;
import org.json.JSONObject;

import java.util.Calendar;

/**
 * مسؤول عن:
 * 1. حفظ قائمة التنبيهات من JavaScript في SharedPreferences
 * 2. جدولة AlarmManager لكل تنبيه
 * 3. إعادة الجدولة عند إعادة تشغيل الجهاز
 */
public class AlarmScheduler {

    public static final String PREFS = "taqwimi_alarms";
    public static final String KEY_LIST = "list";
    public static final String KEY_ENABLED = "enabled";
    public static final String KEY_DAYS = "days";

    /** يستقبل JSON من JavaScript ويجدول كل التنبيهات من جديد */
    public static void scheduleFromJson(Context ctx, String json, boolean enabled, int days) {
        SharedPreferences sp = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
        sp.edit()
          .putString(KEY_LIST, json == null ? "[]" : json)
          .putBoolean(KEY_ENABLED, enabled)
          .putInt(KEY_DAYS, days)
          .apply();

        cancelAll(ctx);
        if (!enabled) return;

        try {
            JSONArray arr = new JSONArray(json == null ? "[]" : json);
            for (int i = 0; i < arr.length(); i++) {
                JSONObject o = arr.getJSONObject(i);
                scheduleOne(ctx, o);
            }
        } catch (Exception ignored) {}
    }

    /** يعيد الجدولة من SharedPreferences (يُستدعى عند إعادة تشغيل الجهاز أو عند فتح التطبيق) */
    public static void rescheduleAll(Context ctx) {
        SharedPreferences sp = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
        String json = sp.getString(KEY_LIST, "[]");
        boolean enabled = sp.getBoolean(KEY_ENABLED, false);
        int days = sp.getInt(KEY_DAYS, 2);
        scheduleFromJson(ctx, json, enabled, days);
    }

    private static void scheduleOne(Context ctx, JSONObject o) {
        try {
            String id = o.optString("id", "");
            String type = o.optString("type", "مناسبة");
            String name = o.optString("name", "");
            String date = o.optString("date", "");  // yyyy-MM-dd (ميلادي)
            int daysBefore = o.optInt("daysBefore", 2);
            if (id.isEmpty() || date.isEmpty()) return;

            // احسب وقت التنبيه: التاريخ - daysBefore يوم، الساعة 9 صباحاً
            String[] parts = date.split("-");
            if (parts.length != 3) return;
            int y = Integer.parseInt(parts[0]);
            int m = Integer.parseInt(parts[1]);
            int d = Integer.parseInt(parts[2]);

            Calendar cal = Calendar.getInstance();
            cal.set(Calendar.YEAR, y);
            cal.set(Calendar.MONTH, m - 1);
            cal.set(Calendar.DAY_OF_MONTH, d);
            cal.set(Calendar.HOUR_OF_DAY, 9);
            cal.set(Calendar.MINUTE, 0);
            cal.set(Calendar.SECOND, 0);
            cal.set(Calendar.MILLISECOND, 0);
            cal.add(Calendar.DAY_OF_MONTH, -daysBefore);

            long triggerAt = cal.getTimeInMillis();
            if (triggerAt <= System.currentTimeMillis()) return; // فات وقته

            AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
            if (am == null) return;

            Intent intent = new Intent(ctx, AlarmReceiver.class);
            intent.putExtra("title", "تذكير بمناسبة");
            intent.putExtra("body", type + (name.isEmpty() ? "" : " – " + name) + "\n" + date);
            intent.putExtra("id", id.hashCode());

            int reqCode = id.hashCode();
            int flags = PendingIntent.FLAG_UPDATE_CURRENT;
            if (Build.VERSION.SDK_INT >= 23) flags |= PendingIntent.FLAG_IMMUTABLE;
            PendingIntent pi = PendingIntent.getBroadcast(ctx, reqCode, intent, flags);

            try {
                if (Build.VERSION.SDK_INT >= 23) {
                    am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pi);
                } else {
                    am.setExact(AlarmManager.RTC_WAKEUP, triggerAt, pi);
                }
            } catch (SecurityException se) {
                // لا يوجد إذن SCHEDULE_EXACT_ALARM — استخدم set() العادي
                am.set(AlarmManager.RTC_WAKEUP, triggerAt, pi);
            }
        } catch (Exception ignored) {}
    }

    /** إلغاء جميع التنبيهات المجدولة */
    public static void cancelAll(Context ctx) {
        try {
            SharedPreferences sp = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
            JSONArray arr = new JSONArray(sp.getString(KEY_LIST, "[]"));
            AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
            if (am == null) return;
            for (int i = 0; i < arr.length(); i++) {
                JSONObject o = arr.getJSONObject(i);
                String id = o.optString("id", "");
                if (id.isEmpty()) continue;
                Intent intent = new Intent(ctx, AlarmReceiver.class);
                int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                if (Build.VERSION.SDK_INT >= 23) flags |= PendingIntent.FLAG_IMMUTABLE;
                PendingIntent pi = PendingIntent.getBroadcast(ctx, id.hashCode(), intent, flags);
                am.cancel(pi);
            }
        } catch (Exception ignored) {}
    }
}
''',
    'app/src/main/java/com/taqwimi/mahaam/AlarmReceiver.java': r'''package com.taqwimi.mahaam;

import android.app.Notification;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.PendingIntent;
import android.content.BroadcastReceiver;
import android.content.Context;
import android.content.Intent;
import android.os.Build;

/** يستيقظ عند حلول وقت التنبيه ويُظهر الإشعار */
public class AlarmReceiver extends BroadcastReceiver {

    private static final String CHANNEL_ID = "taqwimi_reminders";

    @Override
    public void onReceive(Context context, Intent intent) {
        String title = intent.getStringExtra("title");
        String body = intent.getStringExtra("body");
        int id = intent.getIntExtra("id", 0);
        if (title == null) title = "تقويمي";
        if (body == null) body = "";

        NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
        if (nm == null) return;

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            NotificationChannel channel = new NotificationChannel(
                CHANNEL_ID, "تذكيرات تقويمي", NotificationManager.IMPORTANCE_HIGH
            );
            channel.setDescription("تنبيهات المناسبات والمهام");
            nm.createNotificationChannel(channel);
        }

        Intent openApp = new Intent(context, MainActivity.class);
        openApp.setFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
        int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
        if (Build.VERSION.SDK_INT >= 23) piFlags |= PendingIntent.FLAG_IMMUTABLE;
        PendingIntent pi = PendingIntent.getActivity(context, 0, openApp, piFlags);

        Notification.Builder builder;
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            builder = new Notification.Builder(context, CHANNEL_ID);
        } else {
            builder = new Notification.Builder(context);
        }
        builder.setSmallIcon(android.R.drawable.ic_dialog_info)
               .setContentTitle(title)
               .setContentText(body)
               .setStyle(new Notification.BigTextStyle().bigText(body))
               .setContentIntent(pi)
               .setAutoCancel(true);

        try {
            nm.notify(id != 0 ? id : (int) (System.currentTimeMillis() % Integer.MAX_VALUE), builder.build());
        } catch (Exception ignored) {}
    }
}
