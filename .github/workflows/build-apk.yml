    'app/src/main/java/com/taqwimi/mahaam/MainActivity.java': r'''package com.taqwimi.mahaam;

import android.Manifest;
import android.app.Activity;
import android.app.Notification;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.PendingIntent;
import android.content.ActivityNotFoundException;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.content.pm.ResolveInfo;
import android.net.Uri;
import android.os.Build;
import android.os.Bundle;
import android.util.Base64;
import android.webkit.JavascriptInterface;
import android.webkit.PermissionRequest;
import android.webkit.ValueCallback;
import android.webkit.WebChromeClient;
import android.webkit.WebResourceRequest;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.widget.Toast;

import org.json.JSONObject;

import java.io.OutputStream;
import java.util.List;

public class MainActivity extends Activity {

    private static final int REQ_PICK_FILE = 1001;
    private static final int REQ_SAVE_FILE = 1002;
    private static final int REQ_NOTIF_PERMISSION = 1003;
    private static final int REQ_EXACT_ALARM = 1004;
    private static final String CHANNEL_ID = "taqwimi_reminders";

    private WebView webView;
    private ValueCallback<Uri[]> filePathCallback;
    private byte[] pendingBytes;
    private String pendingName;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        createNotificationChannel();

        webView = new WebView(this);
        webView.setBackgroundColor(0xFF303030);
        setContentView(webView);

        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);
        settings.setSupportZoom(false);
        settings.setBuiltInZoomControls(false);

        webView.setWebViewClient(new WebViewClient() {
            @Override
            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                return handleUrl(request.getUrl());
            }
            @SuppressWarnings("deprecation")
            @Override
            public boolean shouldOverrideUrlLoading(WebView view, String url) {
                return handleUrl(Uri.parse(url));
            }
        });

        webView.setWebChromeClient(new WebChromeClient() {
            @Override
            public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                filePathCallback = callback;
                try {
                    startActivityForResult(params.createIntent(), REQ_PICK_FILE);
                } catch (ActivityNotFoundException e) {
                    filePathCallback = null;
                    return false;
                }
                return true;
            }

            @Override
            public void onPermissionRequest(final PermissionRequest request) {
                runOnUiThread(new Runnable() {
                    @Override
                    public void run() {
                        for (String res : request.getResources()) {
                            if ("android.webkit.resource.NOTIFICATION".equals(res)) {
                                if (Build.VERSION.SDK_INT >= 33 &&
                                    checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                                    requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQ_NOTIF_PERMISSION);
                                }
                                request.grant(new String[]{res});
                                return;
                            }
                        }
                        request.grant(request.getResources());
                    }
                });
            }
        });

        webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
        webView.loadUrl("file:///android_asset/index.html");

        // اطلب إذن الإشعارات
        if (Build.VERSION.SDK_INT >= 33 &&
            checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
            requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQ_NOTIF_PERMISSION);
        }

        // جدول التنبيهات عند فتح التطبيق
        AlarmScheduler.rescheduleAll(this);
    }

    private void createNotificationChannel() {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            NotificationChannel channel = new NotificationChannel(
                CHANNEL_ID, "تذكيرات تقويمي", NotificationManager.IMPORTANCE_HIGH
            );
            channel.setDescription("تنبيهات المناسبات والمهام من تطبيق تقويمي");
            NotificationManager nm = getSystemService(NotificationManager.class);
            if (nm != null) nm.createNotificationChannel(channel);
        }
    }

    private boolean handleUrl(Uri uri) {
        String scheme = uri.getScheme();
        if (scheme == null) return false;
        if ("file".equals(scheme) || "about".equals(scheme) || "data".equals(scheme) || "blob".equals(scheme)) return false;

        if ("mailto".equals(scheme)) {
            try {
                Intent i = new Intent(Intent.ACTION_SENDTO, uri);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(i);
            } catch (ActivityNotFoundException e) {
                Toast.makeText(this, "لا يوجد تطبيق بريد مثبّت", Toast.LENGTH_LONG).show();
            }
            return true;
        }
        if ("tel".equals(scheme)) {
            try {
                Intent i = new Intent(Intent.ACTION_DIAL, uri);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(i);
            } catch (ActivityNotFoundException e) {
                Toast.makeText(this, "لا يمكن فتح تطبيق الاتصال", Toast.LENGTH_SHORT).show();
            }
            return true;
        }
        if ("sms".equals(scheme) || "smsto".equals(scheme)) {
            try {
                Intent i = new Intent(Intent.ACTION_SENDTO, uri);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(i);
            } catch (ActivityNotFoundException e) {}
            return true;
        }
        if ("geo".equals(scheme)) {
            try {
                Intent i = new Intent(Intent.ACTION_VIEW, uri);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(i);
            } catch (ActivityNotFoundException e) {}
            return true;
        }
        if ("http".equals(scheme) || "https".equals(scheme)) {
            String host = uri.getHost(); if (host != null) host = host.toLowerCase();
            String path = uri.getPath(); if (path == null) path = "";
            if (isGoogleMapsUrl(host, path, uri.toString())) {
                if (!openInGoogleMaps(uri)) openInBrowser(uri);
                return true;
            }
            if (host != null && (host.contains("wa.me") || host.contains("whatsapp.com"))) {
                if (!openWithPackage(uri, "com.whatsapp")) openInBrowser(uri);
                return true;
            }
            openInBrowser(uri);
            return true;
        }
        try {
            Intent i = new Intent(Intent.ACTION_VIEW, uri);
            i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
            startActivity(i);
        } catch (ActivityNotFoundException ignored) {}
        return true;
    }

    private boolean isGoogleMapsUrl(String host, String path, String url) {
        if (host == null) return false;
        if (host.contains("maps.google.com")) return true;
        if (host.contains("maps.app.goo.gl")) return true;
        if (host.contains("goo.gl") && path.contains("maps")) return true;
        if (host.contains("google.com") && path.startsWith("/maps")) return true;
        if (host.contains("google.com") && url.contains("/maps/")) return true;
        return false;
    }

    private boolean openInGoogleMaps(Uri originalUri) {
        try {
            String q = originalUri.getQueryParameter("q");
            Uri geoUri;
            if (q != null && !q.isEmpty()) {
                geoUri = Uri.parse("geo:0,0?q=" + Uri.encode(q));
            } else {
                String url = originalUri.toString();
                String query = "";
                if (url.contains("/maps/place/")) {
                    int s = url.indexOf("/maps/place/") + 12;
                    int e = url.indexOf("/", s);
                    if (e < 0) e = url.indexOf("?", s);
                    if (e < 0) e = url.length();
                    query = Uri.decode(url.substring(s, e)).replace("+", " ");
                } else if (url.contains("/maps/search/")) {
                    int s = url.indexOf("/maps/search/") + 13;
                    int e = url.indexOf("/", s);
                    if (e < 0) e = url.indexOf("?", s);
                    if (e < 0) e = url.length();
                    query = Uri.decode(url.substring(s, e)).replace("+", " ");
                }
                geoUri = Uri.parse("geo:0,0?q=" + Uri.encode(query.isEmpty() ? url : query));
            }
            Intent intent = new Intent(Intent.ACTION_VIEW, geoUri);
            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
            List<ResolveInfo> list = getPackageManager().queryIntentActivities(intent, 0);
            if (list != null && !list.isEmpty()) { startActivity(intent); return true; }
        } catch (Exception ignored) {}
        return false;
    }

    private boolean openWithPackage(Uri uri, String pkg) {
        try {
            Intent intent = new Intent(Intent.ACTION_VIEW, uri);
            intent.setPackage(pkg);
            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
            startActivity(intent);
            return true;
        } catch (Exception e) { return false; }
    }

    private void openInBrowser(Uri uri) {
        try {
            Intent i = new Intent(Intent.ACTION_VIEW, uri);
            i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
            startActivity(i);
        } catch (ActivityNotFoundException e) {
            Toast.makeText(this, "لا يمكن فتح الرابط", Toast.LENGTH_SHORT).show();
        }
    }

    /** جسر JavaScript ← Android */
    public class Bridge {

        @JavascriptInterface
        public void saveFile(final String name, final String mime, String base64) {
            try { pendingBytes = Base64.decode(base64, Base64.DEFAULT); }
            catch (Exception e) { notifyJs(false, ""); return; }
            pendingName = name;
            runOnUiThread(new Runnable() {
                @Override public void run() {
                    Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                    intent.addCategory(Intent.CATEGORY_OPENABLE);
                    intent.setType((mime == null || mime.length() == 0) ? "application/octet-stream" : mime);
                    intent.putExtra(Intent.EXTRA_TITLE, name);
                    try { startActivityForResult(intent, REQ_SAVE_FILE); }
                    catch (ActivityNotFoundException e) { notifyJs(false, ""); }
                }
            });
        }

        @JavascriptInterface
        public void notify(final String title, final String body) {
            runOnUiThread(new Runnable() { @Override public void run() { showNotification(title, body); } });
        }

        @JavascriptInterface
        public boolean hasNotificationPermission() {
            if (Build.VERSION.SDK_INT >= 33) {
                return checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED;
            }
            NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
            return nm != null && nm.areNotificationsEnabled();
        }

        @JavascriptInterface
        public void requestNotificationPermission() {
            runOnUiThread(new Runnable() {
                @Override public void run() {
                    if (Build.VERSION.SDK_INT >= 33 &&
                        checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                        requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQ_NOTIF_PERMISSION);
                    }
                    // اطلب SCHEDULE_EXACT_ALARM على Android 12+
                    if (Build.VERSION.SDK_INT >= 31) {
                        try {
                            android.app.AlarmManager am = (android.app.AlarmManager) getSystemService(ALARM_SERVICE);
                            if (am != null && !am.canScheduleExactAlarms()) {
                                Intent i = new Intent(android.provider.Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM);
                                i.setData(Uri.parse("package:" + getPackageName()));
                                startActivity(i);
                            }
                        } catch (Exception ignored) {}
                    }
                }
            });
        }

        /** جدولة التنبيهات من JavaScript — تُستدعى عند كل تغيير في البيانات */
        @JavascriptInterface
        public void scheduleAlarms(final String json, final boolean enabled, final int days) {
            runOnUiThread(new Runnable() {
                @Override public void run() {
                    AlarmScheduler.scheduleFromJson(MainActivity.this, json, enabled, days);
                }
            });
        }

        @JavascriptInterface
        public void openUrl(final String url) {
            runOnUiThread(new Runnable() {
                @Override public void run() {
                    if (url == null || url.isEmpty()) return;
                    try { handleUrl(Uri.parse(url)); } catch (Exception ignored) {}
                }
            });
        }

        @JavascriptInterface
        public void sendEmail(final String to, final String subject, final String body) {
            runOnUiThread(new Runnable() {
                @Override public void run() {
                    try {
                        Intent intent = new Intent(Intent.ACTION_SENDTO);
                        intent.setData(Uri.parse("mailto:" + (to == null ? "" : to)));
                        if (subject != null && !subject.isEmpty()) intent.putExtra(Intent.EXTRA_SUBJECT, subject);
                        if (body != null && !body.isEmpty()) intent.putExtra(Intent.EXTRA_TEXT, body);
                        intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                        startActivity(intent);
                    } catch (ActivityNotFoundException e) {
                        Toast.makeText(MainActivity.this, "لا يوجد تطبيق بريد مثبّت", Toast.LENGTH_LONG).show();
                    }
                }
            });
        }

        @JavascriptInterface
        public void dial(final String phone) {
            runOnUiThread(new Runnable() {
                @Override public void run() {
                    try {
                        Intent intent = new Intent(Intent.ACTION_DIAL);
                        intent.setData(Uri.parse("tel:" + (phone == null ? "" : phone)));
                        intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                        startActivity(intent);
                    } catch (ActivityNotFoundException e) {
                        Toast.makeText(MainActivity.this, "لا يمكن فتح تطبيق الاتصال", Toast.LENGTH_SHORT).show();
                    }
                }
            });
        }

        @JavascriptInterface
        public void openMaps(final String location) {
            runOnUiThread(new Runnable() {
                @Override public void run() {
                    if (location == null || location.isEmpty()) return;
                    Uri uri;
                    if (location.startsWith("http://") || location.startsWith("https://")) {
                        uri = Uri.parse(location);
                    } else {
                        uri = Uri.parse("geo:0,0?q=" + Uri.encode(location));
                    }
                    if (!openInGoogleMaps(uri)) {
                        Uri webUri = (location.startsWith("http"))
                            ? Uri.parse(location)
                            : Uri.parse("https://www.google.com/maps/search/?api=1&query=" + Uri.encode(location));
                        openInBrowser(webUri);
                    }
                }
            });
        }
    }

    private void showNotification(String title, String body) {
        NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
        if (nm == null) return;
        Intent intent = new Intent(this, MainActivity.class);
        intent.setFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
        int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
        if (Build.VERSION.SDK_INT >= 23) piFlags |= PendingIntent.FLAG_IMMUTABLE;
        PendingIntent pi = PendingIntent.getActivity(this, 0, intent, piFlags);
        Notification.Builder builder;
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            builder = new Notification.Builder(this, CHANNEL_ID);
        } else {
            builder = new Notification.Builder(this);
        }
        builder.setSmallIcon(android.R.drawable.ic_dialog_info)
               .setContentTitle(title == null ? "تقويمي" : title)
               .setContentText(body == null ? "" : body)
               .setStyle(new Notification.BigTextStyle().bigText(body == null ? "" : body))
               .setContentIntent(pi).setAutoCancel(true);
        try { nm.notify((int) (System.currentTimeMillis() % Integer.MAX_VALUE), builder.build()); }
        catch (Exception ignored) {}
    }

    private void notifyJs(final boolean ok, final String name) {
        webView.post(new Runnable() {
            @Override public void run() {
                webView.evaluateJavascript(
                    "window.__saved && window.__saved(" + ok + "," + JSONObject.quote(name == null ? "" : name) + ")", null);
            }
        });
    }

    @Override
    public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
        super.onRequestPermissionsResult(requestCode, permissions, grantResults);
        if (requestCode == REQ_NOTIF_PERMISSION) {
            boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
            webView.post(new Runnable() {
                @Override public void run() {
                    webView.evaluateJavascript("window.__notifPermission && window.__notifPermission(" + granted + ")", null);
                }
            });
        }
    }

    @Override
    protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        if (requestCode == REQ_PICK_FILE) {
            if (filePathCallback != null) {
                filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                filePathCallback = null;
            }
            return;
        }
        if (requestCode == REQ_SAVE_FILE) {
            boolean ok = false;
            if (resultCode == RESULT_OK && data != null && data.getData() != null && pendingBytes != null) {
                try {
                    OutputStream out = getContentResolver().openOutputStream(data.getData());
                    if (out != null) {
                        try { out.write(pendingBytes); out.flush(); ok = true; }
                        finally { out.close(); }
                    }
                } catch (Exception e) { ok = false; }
            }
            String name = pendingName;
            pendingBytes = null;
            pendingName = null;
            notifyJs(ok, name);
            return;
        }
        super.onActivityResult(requestCode, resultCode, data);
    }

    @Override
    public void onBackPressed() {
        webView.evaluateJavascript(
            "(function(){try{return window.__onBack ? window.__onBack() : false;}catch(e){return false;}})()",
            new ValueCallback<String>() {
                @Override public void onReceiveValue(String value) {
                    if (!"true".equals(value)) MainActivity.super.onBackPressed();
                }
            });
    }

    @Override protected void onPause() { webView.onPause(); super.onPause(); }
    @Override protected void onResume() { super.onResume(); webView.onResume(); }
    @Override protected void onDestroy() { webView.destroy(); super.onDestroy(); }
}
